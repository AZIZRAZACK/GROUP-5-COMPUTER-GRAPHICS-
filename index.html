<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSSD 315 — Troll Platformer (Level Devil)</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Creepster&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #090306;
      color: #f8fafc;
      font-family: monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 8px;
    }
    #toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      font-size: 12px;
    }
    button, select {
      background: #1f090d;
      color: #ffedd5;
      border: 1px solid #dc2626;
      padding: 5px 10px;
      cursor: pointer;
      border-radius: 4px;
    }
    button:hover { background: #3b0d14; }
    canvas {
      border: 3px solid #ef4444;
      box-shadow: 0 0 28px rgba(239, 68, 68, 0.25);
      background: #120407;
    }
  </style>
</head>
<body>
  <div id="toolbar">
    <button id="btnMode1P">1P Mode</button>
    <button id="btnMode2P">2P Split-Screen</button>
    <button id="btnEditor">Level Editor [E]</button>
    <select id="levelSelect"></select>
    <button id="btnSaveJson">Save JSON</button>
    <button id="btnLoadJson">Load JSON</button>
    <input type="file" id="fileInput" accept=".json,.txt" style="display:none" />
  </div>
  <canvas id="gameCanvas" width="960" height="540"></canvas>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
