<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>CSSD 315 — Troll Platformer (Level Devil)</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Creepster&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; overscroll-behavior: none; touch-action: none; }
    body {
      background: var(--palette-sky);
      color: var(--palette-ui);
      font-family: monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      gap: 8px;
    }
    #toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      font-size: 12px;
      width: min(96vw, 1280px);
    }
    button, select {
      background: var(--palette-panel);
      color: var(--palette-ui);
      border: 1px solid var(--palette-panel-border);
      padding: 6px 10px;
      cursor: pointer;
      border-radius: 4px;
      touch-action: none;
    }
    button:hover { background: var(--palette-near-hills); }
    #trackNotice {
      position: fixed;
      top: calc(68px + env(safe-area-inset-top));
      right: max(env(safe-area-inset-right), 12px);
      z-index: 9;
      max-width: min(42vw, 360px);
      padding: 10px 12px;
      border: 2px solid var(--palette-control-border);
      border-radius: 6px;
      background: var(--palette-panel);
      color: var(--palette-ui);
      font: 700 12px monospace;
      text-align: right;
      pointer-events: none;
    }
    #trackNotice[hidden] { display: none; }
    #gameShell {
      position: relative;
      width: min(96vw, 1280px, calc((100dvh - 68px) * 16 / 9));
      aspect-ratio: 16 / 9;
    }
    canvas {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      border: 3px solid var(--palette-panel-border);
      background: var(--palette-sky);
      touch-action: none;
    }
    #touchControls { display: none; }
    .touch-device #touchControls {
      display: block;
      position: fixed;
      inset: 0;
      z-index: 20;
      pointer-events: none;
    }
    .touch-control {
      position: relative;
      width: clamp(64px, 9vw, 82px);
      height: clamp(64px, 9vw, 82px);
      border: 3px solid var(--palette-control-border);
      border-radius: 16px;
      background-color: var(--palette-control-fill);
      background-color: color-mix(in srgb, var(--palette-control) 78%, transparent);
      color: var(--palette-control-icon);
      box-shadow: 0 3px 10px var(--palette-control-shadow);
      font: 800 28px/1 monospace;
      pointer-events: auto;
      z-index: 21;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      transition: transform 70ms ease, background-color 70ms ease, box-shadow 70ms ease;
    }
    .touch-control:active, .touch-control.is-pressed {
      transform: scale(0.92);
      background: var(--palette-control-pressed);
      box-shadow: 0 1px 5px var(--palette-control-shadow);
    }
    #movementControls {
      position: fixed;
      left: calc(16px + env(safe-area-inset-left));
      bottom: calc(16px + env(safe-area-inset-bottom));
      display: flex;
      gap: 8px;
    }
    #jumpControl {
      position: fixed;
      right: calc(16px + env(safe-area-inset-right));
      bottom: calc(16px + env(safe-area-inset-bottom));
      width: clamp(72px, 11vw, 88px);
      height: clamp(72px, 11vw, 88px);
      background-color: var(--palette-jump-control-fill);
      background-color: color-mix(in srgb, var(--palette-jump-control) 82%, transparent);
    }
    #jumpControl:active, #jumpControl.is-pressed {
      background: var(--palette-jump-control-pressed);
    }
    #rotateOverlay { display: none; }
    @media (max-width: 699px) {
      body { display: block; min-height: 100dvh; }
      #gameShell { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; aspect-ratio: auto; }
      canvas { width: 100%; height: 100vh; height: 100dvh; border: 0; }
      #toolbar {
        position: fixed;
        z-index: 10;
        top: max(env(safe-area-inset-top), 6px);
        left: max(env(safe-area-inset-left), 6px);
        width: auto;
        max-width: calc(100vw - 12px);
        gap: 4px;
        padding: 4px;
        border-radius: 6px;
        background: var(--palette-panel);
        opacity: 0.94;
      }
      #toolbar button, #toolbar select { padding: 5px 7px; font-size: 11px; }
      #trackNotice { top: calc(104px + env(safe-area-inset-top)); }
      .touch-device #rotateOverlay {
        display: none;
      }
    }
    @media (min-width: 700px) and (max-height: 500px) {
      body { justify-content: flex-start; }
      #gameShell {
        width: min(96vw, 1280px, calc((100dvh - 78px) * 16 / 9));
      }
    }
    @media (max-width: 699px) and (orientation: portrait) {
      .touch-device #rotateOverlay {
        display: flex;
        position: fixed;
        inset: 0;
        z-index: 10;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: var(--palette-panel);
        color: var(--palette-ui);
        font: 700 20px monospace;
        text-align: center;
      }
    }
  </style>
</head>
<body>
  <div id="toolbar">
    <button id="btnMode1P">1P Mode</button>
    <button id="btnMode2P">2P Split-Screen</button>
    <button id="btnEditor">Level Editor [E]</button>
    <button id="btnMute" type="button" aria-label="Mute music">🔊</button>
    <button id="btnNextSong" type="button" aria-label="Play next song" title="Next song (N)">⏭</button>
    <button id="btnFullscreen" type="button" aria-label="Enter fullscreen">⛶</button>
    <select id="levelSelect"></select>
    <button id="btnSaveJson">Save JSON</button>
    <button id="btnLoadJson">Load JSON</button>
    <input type="file" id="fileInput" accept=".json,.txt" style="display:none" />
  </div>
  <div id="gameShell">
    <canvas id="gameCanvas" width="960" height="540"></canvas>
  </div>
  <div id="trackNotice" role="status" aria-live="polite" hidden></div>
  <div id="touchControls" aria-label="Touch controls">
    <div id="movementControls">
      <button class="touch-control" data-control="left" aria-label="Move left">◀</button>
      <button class="touch-control" data-control="right" aria-label="Move right">▶</button>
    </div>
    <button id="jumpControl" class="touch-control" data-control="jump" aria-label="Jump">▲</button>
  </div>
  <div id="rotateOverlay" role="status">Rotate your phone to landscape</div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
